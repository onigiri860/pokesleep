<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="手持ちの食材の数を入れると、ポケモンスリープで今作れる料理と、あと何個で作れるかを表示します。">
<title>ポケスリ料理判定</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap">
<style>
/* 夜空の青を基調にした、柔らかい丸ゴシックのツール画面 */
:root {
  --bg: #f3f5fb;
  --card: #ffffff;
  --text: #1f2440;
  --muted: #6d7391;
  --line: #dde1ef;
  --chip: #eceffa;
  --accent: #4a6cf0;
  --on-accent: #ffffff;
  --ok: #23854d;
  --ok-bg: #e3f5ea;
  --ng: #cf3f3a;
  --ng-bg: #fdeceb;
  --curry-bg: #fff1dc; --curry: #a85a06;
  --salad-bg: #e5f6e3; --salad: #2f7d32;
  --dessert-bg: #fde7f1; --dessert: #a8336b;
  --font: "M PLUS Rounded 1c", system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12152a; --card: #1c2040; --text: #e8eaf6; --muted: #9ba1c4; --line: #2e3460; --chip: #262b52;
    --accent: #7d95ff; --on-accent: #10132a;
    --ok: #6fd69a; --ok-bg: #18382a; --ng: #ff8a84; --ng-bg: #3d1e24;
    --curry-bg: #3a2a12; --curry: #ffbf6b; --salad-bg: #1c3420; --salad: #8fdc92; --dessert-bg: #3a1e2e; --dessert: #f59ac4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12152a; --card: #1c2040; --text: #e8eaf6; --muted: #9ba1c4; --line: #2e3460; --chip: #262b52;
  --accent: #7d95ff; --on-accent: #10132a;
  --ok: #6fd69a; --ok-bg: #18382a; --ng: #ff8a84; --ng-bg: #3d1e24;
  --curry-bg: #3a2a12; --curry: #ffbf6b; --salad-bg: #1c3420; --salad: #8fdc92; --dessert-bg: #3a1e2e; --dessert: #f59ac4;
  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 10;
}
header h1 { font-size: 1.2rem; margin: 0; }

main { max-width: 960px; margin: 0 auto; padding: 16px; }
section { margin-bottom: 28px; }
h2 { font-size: 1.05rem; margin: 0 0 12px; }
h2 small { color: var(--muted); font-weight: normal; }

button {
  font: inherit;
  cursor: pointer;
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: 8px;
  padding: 6px 12px;
}
button:hover { border-color: var(--accent); }
#reset.confirm { background: var(--ng); border-color: var(--ng); color: var(--card); }

.badge {
  display: inline-block;
  min-width: 1.6em;
  padding: 0 6px;
  border-radius: 999px;
  background: var(--accent);
  color: var(--on-accent);
  font-size: 0.85rem;
  text-align: center;
}

/* ----- アイテム ----- */
.item-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 10px;
}

.item-card {
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: 12px;
  padding: 10px 8px;
  text-align: center;
  transition: border-color .15s;
}
.item-card.owned { border-color: var(--accent); }

.item-img {
  width: 64px;
  height: 64px;
  margin: 0 auto 6px;
  display: grid;
  place-items: center;
}
.item-img img { max-width: 100%; max-height: 100%; }
.item-img .fallback {
  display: none;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--chip);
  font-size: 1.4rem;
  font-weight: bold;
  line-height: 56px;
}
.item-img.no-img img { display: none; }
.item-img.no-img .fallback { display: block; }

.item-name { font-size: 0.85rem; line-height: 1.3; min-height: 2.6em; margin-bottom: 6px; display: flex; align-items: center; justify-content: center; }

.counter { display: flex; align-items: center; justify-content: center; gap: 4px; }
.counter button { width: 30px; height: 30px; padding: 0; font-size: 1.1rem; }
.counter input {
  width: 44px;
  height: 30px;
  text-align: center;
  font: inherit;
  border: 1px solid var(--line);
  border-radius: 6px;
  -moz-appearance: textfield;
}
.counter input::-webkit-outer-spin-button,
.counter input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

/* ----- カテゴリタブ ----- */
.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 16px;
  position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + 54px);
  background: var(--bg);
  padding: 8px 0;
  z-index: 5;
}
.tabs button { border-radius: 999px; }
.tabs button.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

.cat {
  margin-left: 8px;
  font-size: 0.75rem;
  font-weight: normal;
  padding: 1px 8px;
  border-radius: 999px;
  vertical-align: middle;
}
.cat-curry { background: var(--curry-bg); color: var(--curry); }
.cat-salad { background: var(--salad-bg); color: var(--salad); }
.cat-dessert { background: var(--dessert-bg); color: var(--dessert); }

/* ----- レシピ ----- */
.recipe-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }

.recipe {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
}
.recipe.can { border-left: 5px solid var(--ok); }

.recipe-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.recipe-name { font-weight: bold; }
.total { color: var(--ng); white-space: nowrap; }

.lacks, .reqs { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 0.85rem; }
.lack, .req { padding: 2px 8px; border-radius: 999px; }
.lack { background: var(--ng-bg); color: var(--ng); font-weight: bold; }
.req.ok { background: var(--ok-bg); color: var(--ok); }
.req.ng { background: var(--chip); color: var(--muted); }

.empty { color: var(--muted); padding: 8px 0; }

button, input { color: var(--text); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.counter input { background: var(--bg); }

footer { max-width: 960px; margin: 0 auto; padding: 8px 16px 32px; color: var(--muted); font-size: 0.8rem; }
footer a { color: var(--accent); }

@media (max-width: 420px) {
  .item-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .item-card { padding: 8px 4px; }
  .counter button { width: 26px; }
  .counter input { width: 36px; }
}

</style>
</head>

  </main>

const STORAGE_KEY = "item-counts";

let counts = loadCounts();
let currentCategory = "all";

function renderTabs() {
  const tabs = document.getElementById("tabs");
  const list = [{ id: "all", name: "すべて" }, ...CATEGORIES];
  tabs.innerHTML = list
    .map((c) => `<button type="button" data-cat="${c.id}" class="${c.id === currentCategory ? "active" : ""}">${c.name}</button>`)
    .join("");
  tabs.querySelectorAll("button").forEach((btn) =>
    btn.addEventListener("click", () => {
      currentCategory = btn.dataset.cat;
      renderTabs();
      renderResults();
    })
  );
}

function categoryName(id) {
  return CATEGORIES.find((c) => c.id === id)?.name ?? "";
}

function loadCounts() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  } catch {
    return {};
  }
}

function saveCounts() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(counts));
  } catch {}
}

function getCount(id) {
  return counts[id] || 0;
}

function setCount(id, value) {
  counts[id] = Math.max(0, Math.floor(Number(value) || 0));
  saveCounts();
}

    const input = card.querySelector("input");
    const update = (v) => {
      setCount(item.id, v);
      input.value = getCount(item.id);
      card.classList.toggle("owned", getCount(item.id) > 0);
      renderResults();
    };
    input.addEventListener("input", () => update(input.value));
    input.addEventListener("focus", () => input.select());
    card.querySelectorAll("button").forEach((btn) =>
      btn.addEventListener("click", () => update(getCount(item.id) + Number(btn.dataset.step)))
    );

    card.classList.toggle("owned", getCount(item.id) > 0);
    grid.appendChild(card);
  }
}

// ----- 判定 -----
function evaluate(recipe) {
  const missing = [];
  let totalMissing = 0;
  let totalRequired = 0;
  for (const [id, need] of Object.entries(recipe.requires)) {
    const lack = Math.max(0, need - getCount(id));
    totalRequired += need;
    if (lack > 0) {
      missing.push({ id, lack });
      totalMissing += lack;
    }
  }
  return { recipe, missing, totalMissing, totalRequired };
}

function requiresHtml(recipe) {
  return Object.entries(recipe.requires)
    .map(([id, need]) => {
      const have = getCount(id);
      const ok = have >= need;
      return `<span class="req ${ok ? "ok" : "ng"}">${itemById[id]?.name ?? id} ${have}/${need}</span>`;
    })
    .join("");
}

function catTag(recipe) {
  return currentCategory === "all" ? `<span class="cat cat-${recipe.category}">${categoryName(recipe.category)}</span>` : "";
}

function renderResults() {
  const results = RECIPES.filter((r) => currentCategory === "all" || r.category === currentCategory).map(evaluate);
  const can = results.filter((r) => r.totalMissing === 0);
  const almost = results
    .filter((r) => r.totalMissing > 0)
    .sort((a, b) => a.totalMissing - b.totalMissing || a.missing.length - b.missing.length);

  document.getElementById("can-count").textContent = can.length;

  const canEl = document.getElementById("can-make");
  canEl.innerHTML = can.length
    ? can
        .map((r) => `<li class="recipe can"><div class="recipe-name">${r.recipe.name}${catTag(r.recipe)}</div><div class="reqs">${requiresHtml(r.recipe)}</div></li>`)
        .join("")
    : `<li class="empty">まだ作れるものはありません</li>`;

  const almostEl = document.getElementById("almost");
  almostEl.innerHTML = almost.length
    ? almost
        .map((r) => {
          const lacks = r.missing
            .map((m) => `<span class="lack">${itemById[m.id]?.name ?? m.id} ×${m.lack}</span>`)
            .join("");
          return `<li class="recipe">
            <div class="recipe-head">
              <div class="recipe-name">${r.recipe.name}${catTag(r.recipe)}</div>
              <div class="total">あと <strong>${r.totalMissing}</strong> 個</div>
            </div>
            <div class="lacks">不足: ${lacks}</div>
            <div class="reqs">${requiresHtml(r.recipe)}</div>
          </li>`;
        })
        .join("")
    : `<li class="empty">なし</li>`;
}

// confirm() はブラウザや埋め込み環境で無効化されることがあるため、ボタン2度押しで確認する
const resetBtn = document.getElementById("reset");
let resetTimer = null;
resetBtn.addEventListener("click", () => {
  if (!resetBtn.classList.contains("confirm")) {
    resetBtn.classList.add("confirm");
    resetBtn.textContent = "もう一度押すと0に戻します";
    resetTimer = setTimeout(cancelReset, 3000);
    return;
  }
  cancelReset();
  counts = {};
  saveCounts();
  renderItems();
  renderResults();
});

function cancelReset() {
  clearTimeout(resetTimer);
  resetBtn.classList.remove("confirm");
  resetBtn.textContent = "リセット";
}

renderTabs();
renderItems();
renderResults();

</script>
